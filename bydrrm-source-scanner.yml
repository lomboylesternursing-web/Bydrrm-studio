name: BYDRRM Official and Reliable Source Scanner

on:
  schedule:
    # Every hour at minute 17. GitHub cron uses UTC; the minute remains :17 in PH time.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      include_current:
        description: "Create recommendations from current matching posts (testing only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bydrrm-source-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Scan official, government, and mainstream sources
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      INCLUDE_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.include_current || false }}

    steps:
      - name: Validate Firebase secret
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scanner dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bydrrm-scanner"
          cd "$RUNNER_TEMP/bydrrm-scanner"
          npm init -y >/dev/null 2>&1
          npm install firebase-admin@latest cheerio@latest --no-audit --no-fund

      - name: Run BYDRRM source scanner
        shell: bash
        run: |
          cd "$RUNNER_TEMP/bydrrm-scanner"
          cat > scanner.cjs <<'NODE'
          "use strict";
          
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");
          const cheerio = require("cheerio");
          const crypto = require("node:crypto");
          
          const serviceAccountJson = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!serviceAccountJson) throw new Error("FIREBASE_SERVICE_ACCOUNT is missing.");
          
          let serviceAccount;
          try {
            serviceAccount = JSON.parse(serviceAccountJson);
          } catch {
            throw new Error("FIREBASE_SERVICE_ACCOUNT is not valid JSON.");
          }
          
          initializeApp({ credential: cert(serviceAccount) });
          const db = getFirestore();
          
          const INCLUDE_CURRENT = String(process.env.INCLUDE_CURRENT).toLowerCase() === "true";
          const MAX_KNOWN_HASHES = 240;
          const MAX_ENTRIES_PER_SOURCE = 30;
          const MAX_ARTICLES_TO_FOLLOW = 12;
          const FETCH_TIMEOUT_MS = 25000;
          
          const SUPPLEMENTARY_SOURCES = [
            {
              id: "dilg-region3-official-website",
              municipality: "Province-wide",
              type: "website",
              name: "DILG Region III — Official Website",
              url: "https://centralluzon.region3.dilg.gov.ph/",
              selector: "main, .site-main, #content",
              active: true,
              sourceTier: "government-secondary",
              multiLgu: true,
              followArticleLinks: true,
              requireBulacan: true,
              verification: "official_government_secondary"
            },
            {
              id: "pia-news-official-website",
              municipality: "Province-wide",
              type: "website",
              name: "Philippine Information Agency — Official News",
              url: "https://pia.gov.ph/news/",
              selector: "main, #content",
              active: true,
              sourceTier: "government-secondary",
              multiLgu: true,
              followArticleLinks: true,
              requireBulacan: true,
              verification: "official_government_secondary"
            },
            {
              id: "pna-provincial-official-website",
              municipality: "Province-wide",
              type: "website",
              name: "Philippine News Agency — Provincial News",
              url: "https://www.pna.gov.ph/categories/provincial",
              selector: "main, .container",
              active: true,
              sourceTier: "government-secondary",
              multiLgu: true,
              followArticleLinks: true,
              requireBulacan: true,
              verification: "official_government_secondary"
            },
            {
              id: "gma-serbisyo-publiko-website",
              municipality: "Province-wide",
              type: "website",
              name: "GMA News — Serbisyo Publiko",
              url: "https://www.gmanetwork.com/news/serbisyopubliko/",
              selector: "main, #content, body",
              active: true,
              sourceTier: "media-secondary",
              multiLgu: true,
              followArticleLinks: true,
              requireBulacan: true,
              verification: "mainstream_media_secondary"
            },
            {
              id: "inquirer-newsinfo-website",
              municipality: "Province-wide",
              type: "website",
              name: "INQUIRER.net — NewsInfo",
              url: "https://newsinfo.inquirer.net/",
              selector: "main, #content, body",
              active: true,
              sourceTier: "media-secondary",
              multiLgu: true,
              followArticleLinks: true,
              requireBulacan: true,
              verification: "mainstream_media_secondary"
            },
            {
              id: "philstar-headlines-website",
              municipality: "Province-wide",
              type: "website",
              name: "Philstar.com — Headlines",
              url: "https://www.philstar.com/headlines",
              selector: "main, #content, body",
              active: true,
              sourceTier: "media-secondary",
              multiLgu: true,
              followArticleLinks: true,
              requireBulacan: true,
              verification: "mainstream_media_secondary"
            }
          ];
          
          const LGUS = [
            { name: "Angat", aliases: ["angat"] },
            { name: "Balagtas", aliases: ["balagtas"] },
            { name: "Baliwag", aliases: ["baliwag", "baliuag", "city of baliwag", "city of baliuag"] },
            { name: "Bocaue", aliases: ["bocaue"] },
            { name: "Bulakan", aliases: ["bulakan"] },
            { name: "Bustos", aliases: ["bustos"] },
            { name: "Calumpit", aliases: ["calumpit"] },
            { name: "Doña Remedios Trinidad", aliases: ["dona remedios trinidad", "doña remedios trinidad", "drt bulacan"] },
            { name: "Guiguinto", aliases: ["guiguinto"] },
            { name: "Hagonoy", aliases: ["hagonoy"] },
            { name: "Malolos", aliases: ["malolos", "city of malolos"] },
            { name: "Marilao", aliases: ["marilao"] },
            { name: "Meycauayan", aliases: ["meycauayan", "city of meycauayan"] },
            { name: "Norzagaray", aliases: ["norzagaray"] },
            { name: "Obando", aliases: ["obando"] },
            { name: "Pandi", aliases: ["pandi bulacan", "pandi"] },
            { name: "Paombong", aliases: ["paombong"] },
            { name: "Plaridel", aliases: ["plaridel bulacan", "plaridel"] },
            { name: "Pulilan", aliases: ["pulilan"] },
            { name: "San Ildefonso", aliases: ["san ildefonso"] },
            { name: "San Jose del Monte", aliases: ["san jose del monte", "city of san jose del monte", "csjdm", "sjdm"] },
            { name: "San Miguel", aliases: ["san miguel bulacan"] },
            { name: "San Rafael", aliases: ["san rafael bulacan"] },
            { name: "Santa Maria", aliases: ["santa maria bulacan", "sta maria bulacan", "sta. maria bulacan"] }
          ];
          
          const SUSPENSION_TERMS = [
            "class suspension", "class suspensions", "suspension of classes", "classes are suspended",
            "classes will be suspended", "classes suspended", "suspend classes", "suspended classes",
            "no classes", "walang pasok", "suspendido ang klase", "suspension ng klase",
            "suspensyon ng klase", "face-to-face classes are suspended", "onsite classes are suspended",
            "no face-to-face classes", "shift to online classes", "shifted to online classes",
            "shift to online learning", "shifted to online learning", "switch to online classes",
            "classes will be conducted online", "classes shall be conducted online",
            "online learning modality", "online class modality", "alternative learning modality",
            "alternative delivery mode", "distance learning modality", "modular distance learning",
            "asynchronous classes", "synchronous online classes", "remote learning"
          ];
          
          function normalizeText(value) {
            return String(value || "")
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/&/g, " and ")
              .replace(/[^a-z0-9]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }
          
          function containsSuspensionLanguage(text) {
            const normalized = normalizeText(text);
            return SUSPENSION_TERMS.some(term => normalized.includes(normalizeText(term)));
          }
          
          function containsBulacan(text) {
            const value = normalizeText(text);
            return /\bbulacan\b/.test(value) || /\bbulakan\b/.test(value);
          }
          
          function hasAlias(text, aliases) {
            const value = ` ${normalizeText(text)} `;
            return aliases.some(alias => value.includes(` ${normalizeText(alias)} `));
          }
          
          function detectCategory(text) {
            const value = normalizeText(text);
            const has = pattern => pattern.test(value);
          
            const both = has(/public and private|both public and private|public private|pampubliko at pribado|publiko at pribado|public private schools/);
            const publicOnly = has(/public schools? only|public school only|pampublikong paaralan lamang|public only/);
            const allLevels = has(/all levels|all grade levels|lahat ng antas|lahat ng level|kindergarten to college|kinder to college|preschool to college|daycare to college/);
            const upToShs = has(/up to senior high|until senior high|elementary to senior high|kindergarten to grade 12|kinder to grade 12|preschool to grade 12|daycare to senior high|senior high school/);
            const upToElem = has(/up to elementary|until elementary|preschool to elementary|kindergarten to grade 6|kinder to grade 6|elementary level/);
            const governmentWork = has(/government work|work in government offices|government offices|pasok sa mga tanggapan ng pamahalaan|trabaho sa gobyerno/);
          
            const onlineModality = has(/shift(?:ed)? to online|switch(?:ed)? to online|classes (?:shall|will|are to) be conducted online|online learning modalit|online class modalit|alternative learning modalit|alternative delivery mode|distance learning modalit|modular distance learning|remote learning|asynchronous classes|synchronous online classes|no face to face classes.*(?:online|modular|alternative)|face to face classes.*(?:shifted|moved).*online/);

            if (onlineModality) return "online-modality";
            if (governmentWork && containsSuspensionLanguage(value)) return "classes-work";
            if (allLevels && both) return "all-both";
            if (allLevels && publicOnly) return "all-public";
            if (upToShs && both) return "shs-both";
            if (upToShs && publicOnly) return "shs-public";
            if (upToElem && both) return "elem-both";
            if (upToElem && publicOnly) return "elem-public";
            return "custom";
          }
          
          function confidenceFor(source, category, text) {
            if (source.sourceTier === "media-secondary") return category === "custom" ? "Media report" : "Media report — specific";
            if (source.sourceTier === "government-secondary") return category === "custom" ? "Government report" : "Government report — specific";
            const length = normalizeText(text).length;
            if (category !== "custom" && length >= 70) return "High";
            if (category !== "custom" || length >= 45) return "Medium";
            return "Low";
          }
          
          function sha256(value) {
            return crypto.createHash("sha256").update(String(value)).digest("hex");
          }
          
          function absoluteUrl(base, href) {
            try { return new URL(href || base, base).toString(); }
            catch { return base; }
          }
          
          function uniqueEntries(entries) {
            const seen = new Set();
            const result = [];
            for (const entry of entries) {
              const key = sha256(`${normalizeText(entry.text)}|${entry.link || ""}`);
              if (seen.has(key)) continue;
              seen.add(key);
              result.push(entry);
              if (result.length >= MAX_ENTRIES_PER_SOURCE) break;
            }
            return result;
          }
          
          function likelySuspensionLink(text, href) {
            const value = normalizeText(`${text} ${href}`);
            return containsSuspensionLanguage(value) || /walang pasok|walangpasok|class suspension|suspend classes|classes suspended|online learning|alternative learning|distance learning/.test(value);
          }
          
          function htmlBlocks(raw, selector = "") {
            const $ = cheerio.load(raw);
            $("script, style, noscript, svg, iframe, form, nav, footer").remove();
            const selected = selector ? $(selector).first() : null;
            const root = selected && selected.length ? selected : ($("article").first().length ? $("article").first() : ($("main").first().length ? $("main").first() : $("body")));
            const blocks = [];
            root.find("h1,h2,h3,h4,p,li,blockquote,time").each((_, el) => {
              const text = $(el).text().replace(/\s+/g, " ").trim();
              if (text.length >= 3 && text.length <= 5000) blocks.push(text);
            });
            if (!blocks.length) {
              const text = root.text().replace(/\s+/g, " ").trim();
              if (text) blocks.push(text.slice(0, 15000));
            }
            return blocks;
          }
          
          function parseFeed(raw, baseUrl) {
            const $ = cheerio.load(raw, { xmlMode: true });
            const entries = [];
            $("item, entry").slice(0, MAX_ENTRIES_PER_SOURCE).each((_, element) => {
              const node = $(element);
              const title = node.find("title").first().text().trim();
              const description = node.find("description, summary, content, content\\:encoded").first().text().trim();
              const linkNode = node.find("link").first();
              const href = linkNode.attr("href") || linkNode.text().trim();
              const published = node.find("pubDate, published, updated").first().text().trim();
              const text = `${title}\n${description}`.replace(/\s+/g, " ").trim();
              if (text.length >= 20) entries.push({ title, text, link: absoluteUrl(baseUrl, href), published, blocks: [title, description].filter(Boolean) });
            });
            return uniqueEntries(entries);
          }
          
          function parseWebsite(raw, source) {
            const $ = cheerio.load(raw);
            $("script, style, noscript, svg, iframe").remove();
            const selectedRoot = source.selector ? $(source.selector).first() : null;
            const root = selectedRoot && selectedRoot.length ? selectedRoot : ($("main").first().length ? $("main").first() : $("body"));
            const entries = [];
          
            root.find("article, .post, .news-item, .news, .entry, .announcement, .advisory, .card, .blog-post, .item, li").slice(0, 120).each((_, element) => {
              const node = $(element);
              const text = node.text().replace(/\s+/g, " ").trim();
              if (text.length < 25) return;
              const title = node.find("h1,h2,h3,h4,h5,strong").first().text().replace(/\s+/g, " ").trim();
              const href = node.find("a[href]").first().attr("href");
              if (!containsSuspensionLanguage(text) && !likelySuspensionLink(title, href)) return;
              entries.push({ title, text: text.slice(0, 4000), link: absoluteUrl(source.url, href), published: "", blocks: htmlBlocks($.html(node)) });
            });
          
            root.find("a[href]").slice(0, 350).each((_, element) => {
              const node = $(element);
              const text = node.text().replace(/\s+/g, " ").trim();
              const href = node.attr("href") || "";
              if (!likelySuspensionLink(text, href)) return;
              entries.push({ title: text, text, link: absoluteUrl(source.url, href), published: "", blocks: [text] });
            });
          
            if (!entries.length && containsSuspensionLanguage(root.text())) {
              const blocks = htmlBlocks(raw, source.selector || "");
              const text = blocks.join("\n").slice(0, 12000);
              entries.push({ title: source.name, text, link: source.url, published: "", blocks });
            }
          
            return uniqueEntries(entries);
          }
          
          async function fetchText(url) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
            try {
              const response = await fetch(url, {
                signal: controller.signal,
                redirect: "follow",
                headers: {
                  "user-agent": "Mozilla/5.0 (compatible; BYDRRM-Studio-Monitor/7.1; +https://bydrrm-studio.web.app/)",
                  accept: "text/html,application/rss+xml,application/atom+xml,application/xml;q=0.9,*/*;q=0.8",
                  "accept-language": "en-PH,en;q=0.9,fil;q=0.8",
                  "cache-control": "no-cache"
                }
              });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              return { raw: await response.text(), contentType: response.headers.get("content-type") || "", finalUrl: response.url || url };
            } finally {
              clearTimeout(timeout);
            }
          }
          
          function explicitProvinceWide(text) {
            const value = normalizeText(text);
            return /throughout (the )?province of bulacan|entire province of bulacan|province wide (class )?suspension.*bulacan|all classes in bulacan province|classes .*bulacan province.*suspend|bulacan province.*classes .*suspend/.test(value);
          }
          
          function contextForLgu(blocks, lgu) {
            const matches = [];
            blocks.forEach((block, index) => {
              if (hasAlias(block, lgu.aliases)) matches.push(index);
            });
            if (!matches.length) return "";
            const chosen = matches[0];
            return blocks.slice(Math.max(0, chosen - 1), Math.min(blocks.length, chosen + 2)).join(" — ").slice(0, 1600);
          }
          
          function extractMultiLguFindings(source, article) {
            const blocks = article.blocks && article.blocks.length ? article.blocks : [article.text || ""];
            const whole = blocks.join("\n");
            if (!containsSuspensionLanguage(whole)) return [];
            if (source.requireBulacan && !containsBulacan(whole)) return [];
          
            const findings = [];
            for (const lgu of LGUS) {
              const context = contextForLgu(blocks, lgu);
              if (!context) continue;
              findings.push({
                municipality: lgu.name,
                category: detectCategory(context),
                text: context,
                title: article.title || "Class advisory report",
                link: article.link || source.url,
                published: article.published || ""
              });
            }
          
            if (explicitProvinceWide(whole)) {
              const context = blocks.filter(block => containsBulacan(block) || containsSuspensionLanguage(block)).slice(0, 5).join(" — ").slice(0, 1600);
              findings.push({
                municipality: "Province-wide",
                category: detectCategory(context || whole),
                text: context || whole.slice(0, 1600),
                title: article.title || "Province-wide class advisory report",
                link: article.link || source.url,
                published: article.published || ""
              });
            }
          
            const unique = new Map();
            for (const finding of findings) unique.set(`${finding.municipality}|${finding.link}`, finding);
            return [...unique.values()];
          }
          
          async function fetchSource(source) {
            if (source.type === "facebook") return { skipped: true, reason: "meta_api_required", entries: [], findings: [] };
          
            const fetched = await fetchText(source.url);
            const isFeed = source.type === "rss" || /rss|atom|xml/i.test(fetched.contentType);
            const entries = isFeed ? parseFeed(fetched.raw, fetched.finalUrl) : parseWebsite(fetched.raw, source);
          
            if (!source.multiLgu) return { skipped: false, entries, findings: [] };
          
            const candidateEntries = entries.filter(entry => likelySuspensionLink(entry.text, entry.link)).slice(0, MAX_ARTICLES_TO_FOLLOW);
            const findings = [];
          
            for (const candidate of candidateEntries) {
              let article = candidate;
              if (source.followArticleLinks && candidate.link && candidate.link !== source.url) {
                try {
                  const articleFetch = await fetchText(candidate.link);
                  const blocks = htmlBlocks(articleFetch.raw);
                  article = {
                    ...candidate,
                    link: articleFetch.finalUrl || candidate.link,
                    text: blocks.join("\n"),
                    blocks
                  };
                } catch (error) {
                  console.warn(`Unable to follow article for ${source.id}: ${candidate.link}: ${error.message}`);
                }
              }
              findings.push(...extractMultiLguFindings(source, article));
            }
          
            return { skipped: false, entries, findings };
          }
          
          async function ensureSupplementarySources() {
            for (const source of SUPPLEMENTARY_SOURCES) {
              const ref = db.collection("source_registry").doc(source.id);
              const snapshot = await ref.get();
              const existing = snapshot.exists ? snapshot.data() : {};
              await ref.set({
                ...source,
                active: typeof existing.active === "boolean" ? existing.active : source.active,
                managedSupplementary: true,
                registryVersion: "2026-08-02-v5-online-modality",
                createdAt: snapshot.exists ? (existing.createdAt || FieldValue.serverTimestamp()) : FieldValue.serverTimestamp(),
                updatedAt: FieldValue.serverTimestamp()
              }, { merge: true });
            }
          }
          
          async function createRecommendation(source, finding, contentHash) {
            const ref = db.collection("recommendations").doc(contentHash);
            const existing = await ref.get();
            if (existing.exists) return false;
          
            const category = finding.category || detectCategory(finding.text);
            const secondary = source.sourceTier === "media-secondary" || source.sourceTier === "government-secondary";
          
            await ref.set({
              municipality: finding.municipality || source.municipality,
              category,
              confidence: confidenceFor(source, category, finding.text),
              sourceId: source.id,
              sourceName: source.name || source.municipality,
              sourceType: source.type,
              sourceTier: source.sourceTier || "official-primary",
              requiresOfficialVerification: secondary,
              sourceUrl: finding.link || source.url,
              excerpt: String(finding.text || "").slice(0, 1200),
              publishedText: finding.published || "",
              contentHash,
              status: "pending",
              scanner: "github-actions-v7",
              createdAt: FieldValue.serverTimestamp()
            });
            return true;
          }
          
          async function updateSystemStatus(data) {
            await db.collection("system_status").doc("source_scanner").set(data, { merge: true });
          }
          
          async function scanSources() {
            const startedAt = new Date();
            await ensureSupplementarySources();
          
            await updateSystemStatus({
              running: true,
              triggeredBy: process.env.GITHUB_EVENT_NAME || "github-actions",
              platform: "github-actions",
              scannerVersion: "7.1-online-modality",
              startedAt: FieldValue.serverTimestamp()
            });
          
            const snapshot = await db.collection("source_registry").where("active", "==", true).get();
            let checked = 0;
            let primaryChecked = 0;
            let secondaryChecked = 0;
            let recommendationsCreated = 0;
            let facebookSkipped = 0;
            let failed = 0;
            let baselined = 0;
            const errors = [];
          
            for (const sourceDoc of snapshot.docs) {
              const source = { id: sourceDoc.id, ...sourceDoc.data() };
              try {
                const result = await fetchSource(source);
                if (result.skipped) {
                  facebookSkipped += 1;
                  await sourceDoc.ref.set({
                    lastCheckAt: FieldValue.serverTimestamp(),
                    lastCheckStatus: result.reason,
                    scanner: "github-actions-v7"
                  }, { merge: true });
                  continue;
                }
          
                checked += 1;
                if (source.sourceTier === "media-secondary" || source.sourceTier === "government-secondary") secondaryChecked += 1;
                else primaryChecked += 1;
          
                let scanItems;
                if (source.multiLgu) {
                  scanItems = result.findings.map(finding => ({
                    ...finding,
                    contentHash: sha256(`${source.id}|${finding.municipality}|${finding.link || source.url}`)
                  }));
                } else {
                  scanItems = result.entries
                    .filter(entry => containsSuspensionLanguage(entry.text))
                    .map(entry => ({
                      municipality: source.municipality,
                      category: detectCategory(entry.text),
                      text: entry.text,
                      title: entry.title,
                      link: entry.link,
                      published: entry.published,
                      contentHash: sha256(`${source.id}|${normalizeText(entry.text)}|${entry.link || ""}`)
                    }));
                }
          
                const currentHashes = scanItems.map(item => item.contentHash);
                const knownHashes = Array.isArray(source.knownHashes) ? source.knownHashes : [];
                const knownSet = new Set(knownHashes);
                const firstBaseline = source.baselineComplete !== true;
                let newForSource = 0;
          
                for (const item of scanItems) {
                  const isUnseen = !knownSet.has(item.contentHash);
                  const shouldCreate = isUnseen && (!firstBaseline || INCLUDE_CURRENT);
                  if (shouldCreate && await createRecommendation(source, item, item.contentHash)) {
                    recommendationsCreated += 1;
                    newForSource += 1;
                  }
                }
          
                if (firstBaseline) baselined += 1;
                const mergedHashes = [...new Set([...currentHashes, ...knownHashes])].slice(0, MAX_KNOWN_HASHES);
          
                await sourceDoc.ref.set({
                  baselineComplete: true,
                  knownHashes: mergedHashes,
                  lastCheckAt: FieldValue.serverTimestamp(),
                  lastCheckStatus: "ok",
                  lastEntryCount: result.entries.length,
                  lastMatchCount: scanItems.length,
                  lastNewCount: newForSource,
                  lastError: FieldValue.delete(),
                  scanner: "github-actions-v7"
                }, { merge: true });
              } catch (error) {
                failed += 1;
                const message = error && error.message ? error.message : String(error);
                console.error(`Source check failed: ${source.id}: ${message}`);
                errors.push({ sourceId: source.id, message: message.slice(0, 300) });
                await sourceDoc.ref.set({
                  lastCheckAt: FieldValue.serverTimestamp(),
                  lastCheckStatus: "error",
                  lastError: message.slice(0, 500),
                  scanner: "github-actions-v7"
                }, { merge: true });
              }
            }
          
            const summary = {
              running: false,
              platform: "github-actions",
              scannerVersion: "7.1-online-modality",
              triggeredBy: process.env.GITHUB_EVENT_NAME || "github-actions",
              checked,
              primaryChecked,
              secondaryChecked,
              recommendationsCreated,
              facebookSkipped,
              failed,
              baselined,
              durationMs: Date.now() - startedAt.getTime(),
              completedAt: FieldValue.serverTimestamp()
            };
          
            await updateSystemStatus(summary);
            await db.collection("source_check_logs").add({ ...summary, errors, createdAt: FieldValue.serverTimestamp() });
          
            console.log(JSON.stringify({
              success: true,
              checked,
              primaryChecked,
              secondaryChecked,
              recommendationsCreated,
              facebookSkipped,
              failed,
              baselined,
              includeCurrent: INCLUDE_CURRENT
            }, null, 2));
          
            if (failed > 0 && checked === 0) process.exitCode = 1;
          }
          
          scanSources().catch(async error => {
            console.error(error);
            try {
              await updateSystemStatus({
                running: false,
                platform: "github-actions",
                scannerVersion: "7.1-online-modality",
                lastFatalError: String(error && error.message ? error.message : error).slice(0, 800),
                completedAt: FieldValue.serverTimestamp()
              });
            } catch {}
            process.exitCode = 1;
          });
          NODE
          GITHUB_EVENT_NAME="${{ github.event_name }}" node scanner.cjs
