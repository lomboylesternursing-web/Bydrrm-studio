name: PANaHON Endpoint Discovery

on:
  push:
    branches:
      - agent/bydrrm-weather-v1
    paths:
      - ".github/workflows/panahon-endpoint-discovery.yml"

permissions:
  contents: read

jobs:
  inspect-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public PANaHON radar assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://panahon.gov.ph/radar.html" -o "$RUNNER_TEMP/radar.html"
          python - <<'PY'
          import os,re,pathlib
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'radar.html').read_text(errors='ignore')
          print('=== INLINE WEATHER SNIPPETS ===')
          pattern=re.compile(r'.{0,180}(?:radar|mosaic|reflectivity|rain.?rate|georaster|\.tif|\.tiff|imageOverlay|fetch\(|axios|api\.).{0,300}',re.I|re.S)
          seen=[]
          for m in pattern.finditer(text):
              s=' '.join(m.group(0).split())
              if s not in seen:
                  seen.append(s)
          for s in seen[:140]:
              print(s[:700])
          print('=== URL LITERALS ===')
          urls=sorted(set(re.findall(r'https?://[^"\'`<>\s]+',text)))
          for u in urls:
              print(u[:500])
          print('=== TIFF/IMAGE PATH LITERALS ===')
          paths=sorted(set(re.findall(r'["\']([^"\']+\.(?:tif|tiff|png|jpg|jpeg|webp)(?:\?[^"\']*)?)["\']',text,re.I)))
          for p in paths[:200]:
              print(p)
          PY
