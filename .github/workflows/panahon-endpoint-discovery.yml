name: PANaHON Endpoint Discovery

on:
  push:
    branches:
      - agent/bydrrm-weather-v1
    paths:
      - ".github/workflows/panahon-endpoint-discovery.yml"

permissions:
  contents: read

jobs:
  inspect-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public PANaHON radar assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://panahon.gov.ph"
          curl -fsSL "$BASE/radar.html" -o "$RUNNER_TEMP/radar.html"
          echo "=== SCRIPT SOURCES ==="
          python - <<'PY'
          import os, re, pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'radar.html'
          text=path.read_text(errors='ignore')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
              print(src)
          PY
          echo "=== RADAR.HTML URL/PATH HINTS ==="
          grep -Eoi 'https?://[^"'"'"' <>]+|/[A-Za-z0-9_./?=&%-]*(radar|mosaic|himawari|satellite|reflect|rainrate|rain-rate)[A-Za-z0-9_./?=&%-]*' "$RUNNER_TEMP/radar.html" | sort -u | head -n 100 || true
          echo "=== JAVASCRIPT HINTS ==="
          python - <<'PY'
          import os, re, pathlib, urllib.parse, urllib.request
          base='https://panahon.gov.ph/radar.html'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'radar.html'
          text=path.read_text(errors='ignore')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)
          keys=re.compile(r'.{0,100}(?:radar|mosaic|himawari|satellite|reflectivity|rain.?rate|tileLayer|imageOverlay|wms|wmts|geoserver).{0,180}', re.I)
          for src in srcs:
              url=urllib.parse.urljoin(base,src)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=15).read().decode('utf-8','ignore')
              except Exception as e:
                  print('FETCH_FAIL',url,type(e).__name__)
                  continue
              matches=[]
              for m in keys.finditer(data):
                  s=' '.join(m.group(0).split())
                  if s not in matches: matches.append(s)
              if matches:
                  print('\n###',url)
                  for s in matches[:80]: print(s[:450])
          PY
