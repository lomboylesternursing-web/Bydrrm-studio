name: PANaHON Endpoint Discovery

on:
  push:
    branches:
      - agent/bydrrm-weather-v1
    paths:
      - ".github/workflows/panahon-endpoint-discovery.yml"

permissions:
  contents: read

jobs:
  inspect-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test DNS-over-HTTPS fallback for MeteoPilipinas
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DNS.GOOGLE ==='
          curl --connect-timeout 3 --max-time 15 -fsSL -H 'accept: application/dns-json' \
            'https://dns.google/resolve?name=api.meteopilipinas.gov.ph&type=A' \
            -o "$RUNNER_TEMP/dns.json"
          cat "$RUNNER_TEMP/dns.json"; echo
          IP=$(node -e "const d=require(process.env.RUNNER_TEMP+'/dns.json'); const a=(d.Answer||[]).find(x=>x.type===1); if(!a) process.exit(2); process.stdout.write(a.data)")
          echo "IP=$IP"

          curl --connect-timeout 3 --max-time 20 -L -fsS -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'Origin: https://www.pagasa.dost.gov.ph' \
            -H 'Referer: https://www.pagasa.dost.gov.ph/radar' \
            -H 'Accept: application/json, text/javascript, */*; q=0.01' \
            -H 'User-Agent: Mozilla/5.0' \
            "https://www.pagasa.dost.gov.ph/api/HybridTimeline?t=$(date +%s%3N)" \
            -o "$RUNNER_TEMP/timeline.json"
          RADAR_URL=$(node -e "const d=require(process.env.RUNNER_TEMP+'/timeline.json'); process.stdout.write(d.rainfall_estimate.at(-1).url)")
          PATH_ONLY=$(node -e "const u=new URL(process.argv[1]); process.stdout.write(u.pathname+u.search)" "$RADAR_URL")
          echo "RADAR_URL=$RADAR_URL"

          echo '=== CURL --RESOLVE ==='
          code=$(curl --connect-timeout 5 --max-time 25 --resolve "api.meteopilipinas.gov.ph:443:$IP" \
            -L -sS -D "$RUNNER_TEMP/h.txt" -o "$RUNNER_TEMP/radar.bin" -w '%{http_code}' \
            -H 'Referer: https://www.pagasa.dost.gov.ph/' -H 'User-Agent: Mozilla/5.0' \
            "https://api.meteopilipinas.gov.ph$PATH_ONLY" || true)
          echo "STATUS=$code SIZE=$(wc -c < "$RUNNER_TEMP/radar.bin" 2>/dev/null || echo 0)"
          grep -Ei 'HTTP/|content-type|content-length|server|access-control' "$RUNNER_TEMP/h.txt" || true
          file "$RUNNER_TEMP/radar.bin" || true
