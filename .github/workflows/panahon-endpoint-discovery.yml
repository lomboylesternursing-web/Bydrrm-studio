name: PANaHON Endpoint Discovery

on:
  push:
    branches:
      - agent/bydrrm-weather-v1
    paths:
      - ".github/workflows/panahon-endpoint-discovery.yml"

permissions:
  contents: read

jobs:
  inspect-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect live PAGASA timeline response
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 3 --max-time 20 -L -fsS -X POST \
            -H 'Accept: application/json' \
            -H 'User-Agent: Mozilla/5.0' \
            "https://pagasa.dost.gov.ph/api/HybridTimeline?t=$(date +%s)" \
            -o "$RUNNER_TEMP/timeline.json"
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'timeline.json'
          raw=p.read_text(errors='ignore')
          print('bytes',len(raw))
          print('prefix',raw[:500])
          try:
              data=json.loads(raw)
          except Exception as e:
              print('JSON_ERROR',repr(e)); raise
          print('TYPE',type(data).__name__)
          if isinstance(data,dict):
              print('KEYS',list(data.keys()))
              for k,v in data.items():
                  if isinstance(v,list):
                      print('KEY',k,'COUNT',len(v))
                      for item in v[-3:]: print('ITEM',k,item)
                  else:
                      print('VALUE',k,str(v)[:1000])
          PY
          echo '=== HIMAWARI current frame headers ==='
          curl --connect-timeout 3 --max-time 15 -L -sSI "https://src.meteopilipinas.gov.ph/repo/mtsat-colored/24hour/1-him-colored.png" | grep -Ei 'HTTP/|content-type|content-length|access-control|last-modified|etag' || true
