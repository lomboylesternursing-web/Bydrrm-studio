name: PANaHON Endpoint Discovery

on:
  push:
    branches:
      - agent/bydrrm-weather-v1
    paths:
      - ".github/workflows/panahon-endpoint-discovery.yml"

permissions:
  contents: read

jobs:
  inspect-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test PAGASA HybridTimeline request variants
        shell: bash
        run: |
          set -u
          for host in pagasa.dost.gov.ph www.pagasa.dost.gov.ph; do
            for method in GET POST; do
              echo "=== $method https://$host/api/HybridTimeline ==="
              args=(--connect-timeout 3 --max-time 12 -L -sS -D "$RUNNER_TEMP/h.txt" -o "$RUNNER_TEMP/b.txt" -w '%{http_code}')
              if [ "$method" = POST ]; then args+=(-X POST -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' -H 'X-Requested-With: XMLHttpRequest' -H 'Origin: https://www.pagasa.dost.gov.ph' -H 'Referer: https://www.pagasa.dost.gov.ph/radar'); fi
              args+=(-H 'Accept: application/json, text/javascript, */*; q=0.01' -H 'User-Agent: Mozilla/5.0' "https://$host/api/HybridTimeline?t=$(date +%s%3N)")
              code=$(curl "${args[@]}" || true)
              echo "STATUS=$code BODY_BYTES=$(wc -c < "$RUNNER_TEMP/b.txt" 2>/dev/null || echo 0)"
              grep -Ei 'HTTP/|content-type|content-length|location|set-cookie|access-control' "$RUNNER_TEMP/h.txt" | tail -n 20 || true
              head -c 1200 "$RUNNER_TEMP/b.txt" || true; echo
            done
          done
          echo '=== HIMAWARI current frame ==='
          code=$(curl --connect-timeout 3 --max-time 12 -L -sS -o "$RUNNER_TEMP/him.png" -w '%{http_code}' "https://src.meteopilipinas.gov.ph/repo/mtsat-colored/24hour/1-him-colored.png" || true)
          echo "STATUS=$code SIZE=$(wc -c < "$RUNNER_TEMP/him.png" 2>/dev/null || echo 0)"
          file "$RUNNER_TEMP/him.png" || true
